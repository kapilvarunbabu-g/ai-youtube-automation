name: Daily AI Tech Short

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install FFmpeg and Telugu fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra
          fc-cache -f

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          CONTENT_LANGUAGE: Telugu
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python main.py

      - name: Send Telegram success notification
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          data = json.loads(
              Path("output/published.json").read_text(encoding="utf-8")
          )

          shorts_url = f"https://youtube.com/shorts/{data['video_id']}"

          message = (
              "✅ AI Tech Short published!\n\n"
              f"🎬 {data['title']}\n\n"
              f"▶️ Watch here:\n{shorts_url}"
          )

          telegram_url = (
              f"https://api.telegram.org/bot"
              f"{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          )

          payload = urllib.parse.urlencode({
              "chat_id": os.environ["TELEGRAM_CHAT_ID"],
              "text": message
          }).encode()

          request = urllib.request.Request(
              telegram_url,
              data=payload,
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              print("Telegram notification sent successfully.")
              print(response.read().decode())
          PY

      - name: Commit Excel research log
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content_log.xlsx
          git diff --cached --quiet || git commit -m "daily: update content research log"
          git push

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-youtube-output
          path: output/
          retention-days: 3
